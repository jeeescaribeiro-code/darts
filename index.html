<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pontuação de Dardos</title>
<meta name="description" content="Pontuação de Dardos: sistema competitivo de dardos">
<meta name="theme-color" content="#FF4FBF">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF4FBF;--cyan:#00F0FF;--lime:#B8FF3A;--orange:#FF7A2F;--purple:#9B5DE5;--bg:#0A0A12;--surface:#12121F;--surface2:#1A1A2E;--border:rgba(255,255,255,0.08);--text:#F0EEF8;--muted:rgba(240,238,248,0.45);--radius:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.blob-1{width:500px;height:500px;background:var(--pink);opacity:.10;top:-150px;left:-150px}
.blob-2{width:400px;height:400px;background:var(--cyan);opacity:.08;bottom:-100px;right:-100px;animation-delay:-7s}
.blob-3{width:300px;height:300px;background:var(--purple);opacity:.09;top:40%;left:50%;animation-delay:-3s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.08)}}
.app{position:relative;z-index:1;max-width:1200px;margin:auto;padding:24px 20px 60px}
.header{text-align:center;margin-bottom:36px}
.header-badge{display:inline-block;background:var(--pink);color:#0A0A12;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 14px;border-radius:100px;margin-bottom:12px}
.header h1{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.1;background:linear-gradient(100deg,var(--pink) 0%,var(--cyan) 55%,var(--lime) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--muted);font-size:14px;margin-top:8px;font-family:'DM Mono',monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.setup-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-bottom:16px}
.setup-grid label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input[type="number"],input[type="text"]{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'DM Mono',monospace;font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:var(--pink)}
input::placeholder{color:var(--muted)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
button{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px 20px;border:none;border-radius:12px;cursor:pointer;transition:transform .12s,opacity .12s;letter-spacing:.04em}
button:active{transform:scale(.96)}
.btn-pink{background:var(--pink);color:#0A0A12}
.btn-cyan{background:var(--cyan);color:#0A0A12}
.btn-lime{background:var(--lime);color:#0A0A12}
.btn-orange{background:var(--orange);color:#0A0A12}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:rgba(255,255,255,0.25)}
#setup-names>div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
.remove-btn{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 14px;font-size:16px;border-radius:10px}
.remove-btn:hover{color:#ff5555;border-color:#ff5555}
.round-track{display:flex;align-items:center;gap:12px}
.round-dots{display:flex;gap:8px}
.dot{width:28px;height:8px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);transition:background .3s,transform .3s}
.dot.active{background:var(--pink);transform:scaleX(1.2)}
.dot.done{background:var(--lime)}
.round-label{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted)}

/* mode toggle */
.mode-toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:4px;gap:4px;margin-bottom:16px}
.mode-btn{padding:7px 20px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.mode-btn.active{background:var(--pink);color:#0A0A12}

/* game layout */
.game-layout{display:grid;gap:20px;align-items:start}
.game-layout.mode-auto{grid-template-columns:340px 1fr}
.game-layout.mode-manual{grid-template-columns:1fr}
@media(max-width:800px){.game-layout.mode-auto{grid-template-columns:1fr}}

/* board panel */
.board-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:sticky;top:20px}
.board-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
.board-active-player{font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:10px;font-family:'DM Mono',monospace;min-height:20px}
.dartboard-wrap{width:100%;aspect-ratio:1;cursor:crosshair;user-select:none}
.dartboard-wrap svg{width:100%;height:100%}
.throw-preview{margin-top:12px;min-height:36px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.throw-chip{font-family:'DM Mono',monospace;font-size:13px;background:var(--surface2);border:1px solid var(--border);color:var(--lime);padding:4px 12px;border-radius:100px;animation:pop .2s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.throw-total{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.board-actions{display:flex;gap:8px;margin-top:12px}
.board-actions button{flex:1;font-size:12px;padding:8px 0}
.seg{transition:opacity .12s}
.seg:hover{opacity:.75}
.seg.hit{animation:flash .35s}
@keyframes flash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

/* players */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .3s;position:relative;overflow:hidden;cursor:pointer}
.player-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.player-card:nth-child(1)::before{background:var(--pink)}
.player-card:nth-child(2)::before{background:var(--cyan)}
.player-card:nth-child(3)::before{background:var(--lime)}
.player-card:nth-child(4)::before{background:var(--orange)}
.player-card:nth-child(5)::before{background:var(--purple)}
.player-card:nth-child(6)::before{background:var(--pink)}
.player-card.leader{border-color:rgba(255,79,191,0.4)}
.player-card.active-turn{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.player-name{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.turn-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1;transform:scale(1)}to{opacity:.4;transform:scale(.7)}}
.player-score{font-size:64px;font-weight:800;line-height:1;color:var(--text);font-family:'DM Mono',monospace;transition:color .3s}
.player-score.danger{color:var(--orange)}
.player-score.good{color:var(--lime)}
.player-score.bust{color:#ff5555;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score-input-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.score-input-row input{font-size:18px;text-align:center}
.player-stats{display:flex;gap:10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.stat-pill{background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:100px}
.stat-pill span{color:var(--text);font-weight:500}
.winner-banner{text-align:center;padding:20px;margin:12px 0;border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,79,191,.15),rgba(0,240,255,.1));border:1px solid rgba(255,79,191,.3);opacity:0;transform:translateY(10px) scale(.95);transition:opacity .5s,transform .5s;pointer-events:none}
.winner-banner.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.winner-banner h2{font-size:clamp(20px,4vw,32px);font-weight:800;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.winner-banner p{color:var(--muted);font-size:13px;margin-top:6px}
.lb-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.lb-item:last-child{border-bottom:none}
.lb-rank{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;width:24px;color:var(--muted)}
.lb-rank.gold{color:#FFD700;font-weight:700}
.lb-rank.silver{color:#C0C0C0;font-weight:700}
.lb-rank.bronze{color:#CD7F32;font-weight:700}
.lb-name{flex:1;font-weight:700}
.lb-wins{font-family:'DM Mono',monospace;font-size:13px;background:var(--surface2);border:1px solid var(--border);padding:3px 12px;border-radius:100px;color:var(--lime);font-weight:500}
.history-chip{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:6px;margin:2px 2px 0 0}
.btn-delete{background:rgba(255,85,85,0.15);color:#ff5555;border:1px solid rgba(255,85,85,0.35)}
.btn-delete:hover{background:rgba(255,85,85,0.28);border-color:#ff5555}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px}
.empty{text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;padding:24px}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="app">

  <div class="header">
    <div class="header-badge">dardos</div>
    <h1>Pontuação de Dardos</h1>
    <p>para quem é realmente ruim em matemática</p>
  </div>

  <div class="card">
    <p class="section-title">⚙ configuração</p>
    <div class="setup-grid">
      <div><label>Pontuação alvo</label><input type="number" id="target" placeholder="301" value="301" min="1"></div>
      <div><label>Rounds</label><input type="number" id="rounds" placeholder="3" value="3" min="1" max="9" style="width:80px"></div>
    </div>
    <div id="setup-names"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn-ghost"  onclick="addPlayerInput()">+ Jogador</button>
      <button class="btn-lime"   onclick="start()">Iniciar</button>
      <button class="btn-cyan"   onclick="reusePlayers()">Continuar jogadores</button>
      <button class="btn-orange" onclick="newGame()">Nova partida</button>
      <button class="btn-delete" onclick="deleteGame()">🗑 Excluir jogo</button>
    </div>
  </div>

  <div class="card" id="round-card" style="display:none">
    <div class="round-track">
      <div class="round-dots" id="round-dots"></div>
      <span class="round-label" id="round-label"></span>
    </div>
  </div>

  <div class="winner-banner" id="winner-banner">
    <h2 id="winner-text"></h2>
    <p id="winner-sub"></p>
  </div>

  <!-- mode toggle — hidden until game starts -->
  <div id="mode-toggle-wrap" style="display:none">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-mode-auto"   onclick="setMode('auto')">Alvo</button>
      <button class="mode-btn"        id="btn-mode-manual" onclick="setMode('manual')">Manual</button>
    </div>
  </div>

  <!-- game layout — hidden until game starts -->
  <div class="game-layout mode-auto" id="game-layout" style="display:none">

    <div class="board-panel" id="board-panel">
      <p class="board-title">alvo</p>
      <div class="board-active-player" id="board-active-player">Selecione um jogador</div>
      <div class="dartboard-wrap">
        <svg id="dartboard-svg" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="throw-preview" id="throw-preview"></div>
      <div class="board-actions">
        <button class="btn-pink"  onclick="confirmThrow()">✓ Confirmar</button>
        <button class="btn-ghost" onclick="clearThrow()">✕ Limpar</button>
      </div>
    </div>

    <div class="players" id="game"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <p class="section-title">🏆 leaderboard — partidas ganhas</p>
    <div id="leaderboard"><div class="empty">Inicie uma partida para ver o placar</div></div>
  </div>

</div>

<audio id="winSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8c1c9d6.mp3?filename=success-1-6297.mp3" type="audio/mpeg">
</audio>

<script>
/* ── state ── */
let players      = [];
let round        = 1;
let maxRounds    = 3;
let target       = 301;
let lastPlayers  = [];
let gameActive   = false;
let inputMode    = 'auto';   // 'auto' | 'manual'
let activePid    = null;     // active player id for dartboard
let pending      = [];       // [{pts,label}] pending throws

/* ── init ── */
window.addEventListener('DOMContentLoaded', () => {
  buildDartboard();
  loadState();
  if (players.length && gameActive) {
    applyMode();
    showGame();
    renderGame();
  } else {
    players = []; lastPlayers = []; gameActive = false;
    addPlayerInput();
    addPlayerInput();
  }
  updateLeaderboard();
});

/* ── mode ── */
function setMode(mode) {
  inputMode = mode;
  applyMode();
  if (mode === 'manual') { activePid = null; clearThrow(); renderGame(); }
  else renderGame();
}

function applyMode() {
  const layout  = document.getElementById('game-layout');
  const bAuto   = document.getElementById('btn-mode-auto');
  const bManual = document.getElementById('btn-mode-manual');
  const bPanel  = document.getElementById('board-panel');
  if (!layout) return;
  if (inputMode === 'auto') {
    layout.classList.add('mode-auto');
    layout.classList.remove('mode-manual');
    if (bPanel)  bPanel.style.display = '';
    if (bAuto)   bAuto.classList.add('active');
    if (bManual) bManual.classList.remove('active');
  } else {
    layout.classList.add('mode-manual');
    layout.classList.remove('mode-auto');
    if (bPanel)  bPanel.style.display = 'none';
    if (bManual) bManual.classList.add('active');
    if (bAuto)   bAuto.classList.remove('active');
  }
}

function showGame() {
  document.getElementById('game-layout').style.display  = 'grid';
  document.getElementById('mode-toggle-wrap').style.display = 'block';
  applyMode();
}

/* ── setup ── */
function addPlayerInput() {
  const wrap = document.getElementById('setup-names');
  const idx  = wrap.children.length;
  const div  = document.createElement('div');
  div.innerHTML = `<input type="text" class="pname" placeholder="Jogador ${idx+1}">
    <button class="remove-btn" onclick="removeInput(this)">✕</button>`;
  wrap.appendChild(div);
}
function removeInput(btn) {
  btn.parentElement.remove();
  document.querySelectorAll('.pname').forEach((el,i) => el.placeholder = `Jogador ${i+1}`);
}

/* ── game control ── */
function start() {
  const names = [...document.querySelectorAll('.pname')].map(el => el.value.trim()).filter(Boolean);
  if (!names.length) { alert('Adicione pelo menos um jogador.'); return; }
  target    = parseInt(document.getElementById('target').value) || 301;
  maxRounds = parseInt(document.getElementById('rounds').value) || 3;
  players   = names.map((name, idx) => ({
    id: idx, name, score: target, roundWins: 0,
    matchWins: lastPlayers.find(p => p.name === name)?.matchWins ?? 0,
    history: []
  }));
  round = 1; gameActive = true; activePid = null; clearThrow();
  hideBanner(); showGame(); renderGame(); saveState();
}

function reusePlayers() {
  if (!lastPlayers.length) { alert('Nenhuma partida anterior encontrada.'); return; }
  target    = parseInt(document.getElementById('target').value) || 301;
  maxRounds = parseInt(document.getElementById('rounds').value) || 3;
  players   = lastPlayers.map(p => ({ ...p, score: target, roundWins: 0, history: [] }));
  round = 1; gameActive = true; activePid = null; clearThrow();
  hideBanner(); showGame(); renderGame(); saveState();
}

function newGame() {
  if (!players.length) { alert('Inicie uma partida primeiro.'); return; }
  if (!confirm('Resetar para nova partida? Vitórias de partida são mantidas.')) return;
  lastPlayers = deepCopy(players);
  players.forEach(p => { p.score = target; p.roundWins = 0; p.history = []; });
  round = 1; gameActive = true; activePid = null; clearThrow();
  hideBanner(); renderGame(); saveState();
}

/* ── scoring ── */
function applyScore(id, val) {
  const p = players.find(x => x.id === id);
  if (!p || isNaN(val) || val < 0) return;
  const next = p.score - val;
  p.history.push({ val, prevScore: p.score });
  p.score = next <= 0 ? 0 : next;
  if (next <= 0) {
    p.roundWins++;
    if (round >= maxRounds) { finishMatch(); return; }
    round++;
    players.forEach(x => { x.score = target; x.history = []; });
    activePid = null; clearThrow();
  }
  saveState(); renderGame();
}

function addScore(id) {
  const inp = document.getElementById('score-input-' + id);
  const val = parseInt(inp.value);
  if (!isNaN(val) && val >= 0) applyScore(id, val);
  inp.value = '';
}

function undoScore(id) {
  const p = players.find(x => x.id === id);
  if (!p || !p.history.length) return;
  const last = p.history.pop();
  if (last.prevScore === 0 && p.score === target) {
    round = Math.max(1, round - 1);
    players.forEach(x => { if (x.id !== id) x.score = target; });
    if (p.roundWins > 0) p.roundWins--;
  }
  p.score = last.prevScore;
  saveState(); renderGame();
}

/* ── dartboard interaction ── */
function onSegmentClick(e) {
  if (!gameActive) return;
  if (activePid === null) { showBoardMsg('Clique num jogador primeiro!'); return; }
  if (pending.length >= 3) { showBoardMsg('Máx 3 dardos — confirme ou limpe'); return; }
  const el    = e.currentTarget;
  const pts   = parseInt(el.dataset.pts);
  const label = el.dataset.label;
  pending.push({ pts, label });
  // animate before any re-render
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  setTimeout(() => { if (el) el.classList.remove('hit'); }, 400);
  renderThrowPreview();
}

function confirmThrow() {
  if (!pending.length || activePid === null) return;
  const total = pending.reduce((s, t) => s + t.pts, 0);
  applyScore(activePid, total);
  clearThrow();
}

function clearThrow() {
  pending = [];
  renderThrowPreview();
}

function renderThrowPreview() {
  const wrap = document.getElementById('throw-preview');
  if (!wrap) return;
  if (!pending.length) { wrap.innerHTML = ''; return; }
  const total = pending.reduce((s, t) => s + t.pts, 0);
  wrap.innerHTML = pending.map(t =>
    `<span class="throw-chip">${t.label} <strong>${t.pts}</strong></span>`
  ).join('') + `<span class="throw-total">= ${total} pts</span>`;
}

function setActivePlayer(id) {
  activePid = id;
  clearThrow();
  renderGame();
  updateBoardHeader();
}

function updateBoardHeader() {
  const el = document.getElementById('board-active-player');
  if (!el) return;
  if (activePid === null) { el.textContent = 'Selecione um jogador'; el.style.color = ''; return; }
  const p = players.find(x => x.id === activePid);
  el.textContent = p ? `🎯 ${p.name} — ${p.score} pts` : '';
  el.style.color = '';
}

function showBoardMsg(msg) {
  const el = document.getElementById('board-active-player');
  if (!el) return;
  el.style.color = 'var(--orange)';
  el.textContent = msg;
  setTimeout(() => updateBoardHeader(), 2000);
}

/* ── finish match ── */
function finishMatch() {
  const winner = [...players].sort((a,b) => b.roundWins - a.roundWins || a.score - b.score)[0];
  winner.matchWins++;
  lastPlayers = deepCopy(players);
  gameActive  = false; activePid = null; clearThrow();
  const wins = loadWins();
  players.forEach(p => { if (p.matchWins > (wins[p.name]||0)) wins[p.name] = p.matchWins; });
  try { localStorage.setItem('badmath_v2_wins', JSON.stringify(wins)); } catch(_) {}
  document.getElementById('winner-text').textContent = `🎯 ${winner.name} venceu!`;
  document.getElementById('winner-sub').textContent  =
    `${winner.roundWins} round${winner.roundWins!==1?'s':''} ganho${winner.roundWins!==1?'s':''} · próxima partida em 4s…`;
  document.getElementById('winner-banner').classList.add('show');
  try { document.getElementById('winSound').play(); } catch(_) {}
  saveState(); renderGame(); updateLeaderboard();
  setTimeout(() => {
    lastPlayers = deepCopy(players);
    players.forEach(p => { p.score = target; p.roundWins = 0; p.history = []; });
    round = 1; gameActive = true;
    hideBanner(); saveState(); renderGame();
  }, 4000);
}

function hideBanner() { document.getElementById('winner-banner').classList.remove('show'); }

/* ── render ── */
function renderGame() {
  const container = document.getElementById('game');
  if (!container) return;
  container.innerHTML = '';
  if (!players.length) return;

  const roundCard = document.getElementById('round-card');
  if (roundCard) {
    roundCard.style.display = 'block';
    const dotsEl = document.getElementById('round-dots');
    dotsEl.innerHTML = '';
    for (let r = 1; r <= maxRounds; r++) {
      const d = document.createElement('div');
      d.className = 'dot' + (r < round ? ' done' : r === round ? ' active' : '');
      dotsEl.appendChild(d);
    }
    document.getElementById('round-label').textContent = `Round ${round} de ${maxRounds}`;
  }

  const leaderId = gameActive
    ? players.reduce((a,b) => a.score < b.score ? a : b).id
    : players.reduce((a,b) => a.roundWins > b.roundWins ? a : b).id;

  players.forEach(p => {
    const pct        = p.score / target;
    const scoreClass = p.score === 0 ? 'good' : pct <= 0.2 ? 'danger' : '';
    const isLeader   = p.id === leaderId && players.length > 1;
    const isActive   = p.id === activePid && inputMode === 'auto';

    const card = document.createElement('div');
    card.className = 'player-card' + (isLeader ? ' leader' : '') + (isActive ? ' active-turn' : '');
    if (inputMode === 'auto') {
      card.style.cursor = 'pointer';
      card.onclick = () => setActivePlayer(p.id);
    }
    card.innerHTML = `
      <div class="player-name">
        ${escHtml(p.name)} ${isLeader ? '⚡' : ''}
        ${isActive ? '<span class="turn-dot"></span>' : ''}
      </div>
      <div class="player-score ${scoreClass}" id="score-display-${p.id}">${p.score}</div>
      <div class="score-input-row" onclick="event.stopPropagation()"
           style="${inputMode === 'auto' ? 'display:none' : ''}">
        <input type="number" id="score-input-${p.id}" placeholder="pontos" min="0"
          onkeydown="if(event.key==='Enter') addScore(${p.id})">
        <button class="btn-pink"  onclick="addScore(${p.id})">✓</button>
        <button class="btn-ghost" onclick="undoScore(${p.id})" title="Desfazer">↩</button>
      </div>
      <div class="player-stats">
        <div class="stat-pill">rounds <span>${p.roundWins}</span></div>
        <div class="stat-pill">partidas <span>${p.matchWins}</span></div>
      </div>
      ${p.history.length ? `<div>${p.history.slice(-5).map(h =>
        `<span class="history-chip">-${h.val}</span>`).join('')}</div>` : ''}`;
    container.appendChild(card);
  });

  updateBoardHeader();
  updateLeaderboard();
}

/* ── leaderboard ── */
function updateLeaderboard() {
  const lb = document.getElementById('leaderboard');
  if (!lb) return;
  const saved = loadWins();
  [...players, ...lastPlayers].forEach(p => {
    if (p.matchWins > (saved[p.name] || 0)) saved[p.name] = p.matchWins;
  });
  const entries = Object.entries(saved).filter(([,w]) => w > 0).sort((a,b) => b[1]-a[1]);
  if (!entries.length) { lb.innerHTML = '<div class="empty">Nenhuma vitória registrada ainda</div>'; return; }
  const medals = ['gold','silver','bronze'];
  lb.innerHTML = entries.map(([name,wins],i) => `
    <div class="lb-item">
      <div class="lb-rank ${medals[i]||''}">#${i+1}</div>
      <div class="lb-name">${escHtml(name)}</div>
      <div class="lb-wins">${wins} ${wins===1?'vitória':'vitórias'}</div>
    </div>`).join('');
}

/* ── persist ── */
function saveState() {
  try {
    localStorage.setItem('badmath_v2_game', JSON.stringify({players,round,maxRounds,target,lastPlayers,gameActive,inputMode}));
    const wins = {};
    [...players, ...lastPlayers].forEach(p => {
      if (!wins[p.name] || p.matchWins > wins[p.name]) wins[p.name] = p.matchWins;
    });
    const existing = loadWins();
    Object.keys(existing).forEach(n => { if (!wins[n]) wins[n] = existing[n]; });
    localStorage.setItem('badmath_v2_wins', JSON.stringify(wins));
  } catch(_) {}
}
function loadWins() {
  try { return JSON.parse(localStorage.getItem('badmath_v2_wins') || '{}'); } catch(_) { return {}; }
}
function loadState() {
  try {
    const raw = localStorage.getItem('badmath_v2_game');
    if (!raw) return;
    const s = JSON.parse(raw);
    players    = s.players     || [];
    round      = s.round       || 1;
    maxRounds  = s.maxRounds   || 3;
    target     = s.target      || 301;
    lastPlayers= s.lastPlayers || [];
    gameActive = s.gameActive  ?? false;
    inputMode  = s.inputMode   || 'auto';
    document.getElementById('target').value = target;
    document.getElementById('rounds').value = maxRounds;
  } catch(_) {}
}
function deleteGame() {
  players = []; lastPlayers = []; round = 1; maxRounds = 3; target = 301;
  gameActive = false; activePid = null; pending = []; inputMode = 'auto';
  try { localStorage.removeItem('badmath_v2_game'); } catch(_) {}
  document.getElementById('game-layout').style.display = 'none';
  document.getElementById('mode-toggle-wrap').style.display = 'none';
  document.getElementById('round-card').style.display = 'none';
  hideBanner();
  document.getElementById('target').value = 301;
  document.getElementById('rounds').value = 3;
  const wrap = document.getElementById('setup-names');
  wrap.innerHTML = '';
  addPlayerInput(); addPlayerInput();
  updateLeaderboard();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── utils ── */
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function escHtml(s)  { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── dartboard build ── */
const CX = 220, CY = 220;
const SECTORS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R = { bull:15, bull25:37, inner:86, tripleIn:86, tripleOut:102, doubleIn:148, doubleOut:164, numInner:168, numOuter:210 };
const C = { black:'#1c1c1c', cream:'#ede8d0', red:'#c0001a', green:'#006633', wire:'#444', surround:'#111' };

function buildDartboard() {
  const svg = document.getElementById('dartboard-svg');
  if (!svg) return;
  svg.innerHTML = '';
  // Outer surround (full circle background)
  mkCircle(svg, CX, CY, R.numOuter + 4, '#0d0d0d', 'none', 0);
  // Number ring background
  mkDonutPlain(svg, CX, CY, R.numInner, R.numOuter + 3, '#1a1a1a');
  // Outer border ring
  mkCircle(svg, CX, CY, R.numOuter + 3, 'none', '#333', 2);

  const sliceAngle = 18, half = 9, DEG = Math.PI / 180;
  SECTORS.forEach((num, i) => {
    const mid = i * sliceAngle - 90;
    const s = mid - half, e = mid + half;
    const even = i % 2 === 0;
    mkArc(svg, CX, CY, R.bull25,    R.tripleIn,  s, e, even ? C.black : C.cream, num, 'S', 1);
    mkArc(svg, CX, CY, R.tripleIn,  R.tripleOut, s, e, even ? C.green : C.red,   num, 'T', 3);
    mkArc(svg, CX, CY, R.tripleOut, R.doubleIn,  s, e, even ? C.black : C.cream, num, 'S', 1);
    mkArc(svg, CX, CY, R.doubleIn,  R.doubleOut, s, e, even ? C.green : C.red,   num, 'D', 2);
    // Number labels inside the number ring
    const lr = (R.numInner + R.numOuter) / 2;
    const t = mkEl('text');
    t.setAttribute('x', CX + lr * Math.cos(mid * DEG));
    t.setAttribute('y', CY + lr * Math.sin(mid * DEG));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'middle');
    t.setAttribute('fill', '#e8e8e8');
    t.setAttribute('font-size', '14');
    t.setAttribute('font-weight', '700');
    t.setAttribute('font-family', 'DM Mono,monospace');
    t.setAttribute('pointer-events', 'none');
    t.textContent = num;
    svg.appendChild(t);
  });
  // Thin separator between double ring and number ring
  mkCircle(svg, CX, CY, R.numInner, 'none', '#333', 1.5);
  // outer bull (25)
  mkDonut(svg, CX, CY, R.bull, R.bull25, C.green, 25, 'B25');
  // bullseye (50)
  const bull = mkEl('circle');
  bull.setAttribute('cx', CX); bull.setAttribute('cy', CY); bull.setAttribute('r', R.bull);
  bull.setAttribute('fill', C.red); bull.setAttribute('stroke', C.wire); bull.setAttribute('stroke-width', '1.5');
  bull.classList.add('seg'); bull.dataset.pts = 50; bull.dataset.label = 'BULL';
  bull.addEventListener('click', onSegmentClick);
  svg.appendChild(bull);
  // Wire rings
  [R.bull, R.bull25, R.tripleIn, R.tripleOut, R.doubleIn, R.doubleOut, R.numInner].forEach(r => {
    const c = mkEl('circle');
    c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', r);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', C.wire); c.setAttribute('stroke-width', '1.5');
    c.setAttribute('pointer-events', 'none');
    svg.appendChild(c);
  });
}

function mkDonutPlain(svg, cx, cy, r1, r2, fill) {
  const el = mkEl('path');
  el.setAttribute('d',
    `M${cx+r2} ${cy} A${r2} ${r2} 0 1 0 ${cx-r2} ${cy} A${r2} ${r2} 0 1 0 ${cx+r2} ${cy} Z ` +
    `M${cx+r1} ${cy} A${r1} ${r1} 0 1 1 ${cx-r1} ${cy} A${r1} ${r1} 0 1 1 ${cx+r1} ${cy} Z`);
  el.setAttribute('fill', fill);
  el.setAttribute('pointer-events', 'none');
  svg.appendChild(el);
}

function mkArc(svg, cx, cy, r1, r2, s, e, fill, num, ring, mult) {
  const el = mkEl('path');
  el.setAttribute('d', arcPath(cx,cy,r1,r2,s,e));
  el.setAttribute('fill', fill); el.setAttribute('stroke', C.wire); el.setAttribute('stroke-width','0.8');
  el.classList.add('seg');
  el.dataset.pts   = num * mult;
  el.dataset.label = ring==='T' ? `T${num}` : ring==='D' ? `D${num}` : String(num);
  el.addEventListener('click', onSegmentClick); svg.appendChild(el);
}

function mkDonut(svg, cx, cy, r1, r2, fill, pts, label) {
  const el = mkEl('path');
  el.setAttribute('d',
    `M${cx+r2} ${cy} A${r2} ${r2} 0 1 0 ${cx-r2} ${cy} A${r2} ${r2} 0 1 0 ${cx+r2} ${cy} Z ` +
    `M${cx+r1} ${cy} A${r1} ${r1} 0 1 1 ${cx-r1} ${cy} A${r1} ${r1} 0 1 1 ${cx+r1} ${cy} Z`);
  el.setAttribute('fill',fill); el.setAttribute('stroke',C.wire); el.setAttribute('stroke-width','1.5');
  el.classList.add('seg'); el.dataset.pts = pts; el.dataset.label = label;
  el.addEventListener('click', onSegmentClick); svg.appendChild(el);
}

function arcPath(cx, cy, r1, r2, sd, ed) {
  const D = Math.PI/180;
  const s1x = cx+r1*Math.cos(sd*D), s1y = cy+r1*Math.sin(sd*D);
  const e1x = cx+r1*Math.cos(ed*D), e1y = cy+r1*Math.sin(ed*D);
  const s2x = cx+r2*Math.cos(sd*D), s2y = cy+r2*Math.sin(sd*D);
  const e2x = cx+r2*Math.cos(ed*D), e2y = cy+r2*Math.sin(ed*D);
  return `M${s1x} ${s1y} A${r1} ${r1} 0 0 1 ${e1x} ${e1y} L${e2x} ${e2y} A${r2} ${r2} 0 0 0 ${s2x} ${s2y} Z`;
}

function mkCircle(svg, cx, cy, r, fill, stroke, sw) {
  const el = mkEl('circle');
  el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('r',r);
  el.setAttribute('fill',fill);
  if (stroke) { el.setAttribute('stroke',stroke); el.setAttribute('stroke-width',sw); }
  svg.appendChild(el);
}

function mkEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
</script>
